# Installation de Node.js par le Portail d'entreprise (Intune), utilisee par start.bat
# quand Node.js n'est pas installe sur le PC.
#
# Identifiant de l'application Node.js dans le portail (lien companyportal:ApplicationId=...).
# Laisser vide pour passer directement au telechargement de Node.js portable.
PORTAL_APP_ID=07014989-be91-4288-869f-d6e437065d48
#
# Duree maximale d'attente de l'installation, en minutes.
PORTAL_WAIT_MINUTES=15
