# Mise a jour automatique de l'application au lancement de start.bat.
# Les donnees scannees (app\data), les journaux et Node.js portable ne sont jamais modifies.
# Ce fichier n'est pas remplace par une mise a jour : vos reglages sont conserves.

# 1 = verifier et installer les mises a jour a chaque lancement, 0 = ne jamais verifier
UPDATE_ENABLED=1
# Depot GitHub public (proprietaire/nom) et branche
UPDATE_REPO=rroux/Tour-de-controle-cloud
UPDATE_BRANCH=main
